services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: foaf_dev_password
      POSTGRES_DB: foaf_protocol_development
    ports:
      - "5434:5432"
    volumes:
      - foaf_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d foaf_protocol_development"]
      interval: 10s
      timeout: 5s
      retries: 5

  foaf:
    build: .
    ports:
      - "3002:3002"
    volumes:
      - .:/app
      - foaf_bundle:/usr/local/bundle
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:foaf_dev_password@db:5432/foaf_protocol_development
      RAILS_ENV: development
      RAILS_LOG_TO_STDOUT: "true"
      SECRET_KEY_BASE: foaf_dev_secret_key_base_not_for_production

volumes:
  foaf_db_data:
  foaf_bundle:
